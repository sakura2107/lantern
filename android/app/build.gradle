plugins { id 'com.android.application' }
android {
 namespace 'org.lantern.client'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'org.lantern.client'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '0.1.0'
  externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_static' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
